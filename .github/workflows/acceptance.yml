name: Academic and MVP acceptance
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-disposable-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mongodb:
        image: mongo:7.0
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://finsight_test:test-only@localhost:5432/finsight_acceptance_test
      ACCEPTANCE_RUNTIME_DATABASE_URL: postgresql://finsight_runtime:test-only@localhost:5432/finsight_acceptance_test
      ALLOW_TEST_DATABASE: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      MONGODB_URI: mongodb://127.0.0.1:27017
      MONGODB_DB_NAME: finsight_acceptance_telemetry_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Provision fresh database and separate owner/runtime roles
        env:
          PGPASSWORD: ci-disposable-only
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE finsight_test LOGIN PASSWORD 'test-only' NOSUPERUSER NOCREATEDB NOCREATEROLE;"
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE finsight_runtime LOGIN PASSWORD 'test-only' NOSUPERUSER NOCREATEDB NOCREATEROLE;"
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE finsight_auth_probe NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE; GRANT finsight_runtime, finsight_auth_probe TO finsight_test;"
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE finsight_acceptance_test OWNER finsight_test;"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:academic
      - name: Retain sanitized results, SQL plans and synthetic demonstration recordings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mvp-acceptance-evidence
          if-no-files-found: warn
          retention-days: 14
          path: |
            test-results/acceptance/latest.json
            test-results/acceptance/*/report.json
            test-results/acceptance/*/report.md
            test-results/acceptance/*/query-plans.json
            test-results/acceptance/*/browser/**/*.webm
            test-results/acceptance/*/browser/**/investigation-journey.png
      - name: Retain academic SQL and Mongo evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: academic-verification-evidence
          if-no-files-found: warn
          retention-days: 14
          path: |
            test-results/academic/latest.json
            test-results/academic/*/report.json
            test-results/academic/*/report.md
            test-results/academic/*/sql-results.json
            test-results/academic/*/query-plans.json
