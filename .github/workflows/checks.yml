name: Scaffold checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-disposable-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://finsight_test:test-only@localhost:5432/finsight_test
      ALLOW_TEST_DATABASE: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Create isolated non-superuser test database
        env:
          PGPASSWORD: ci-disposable-only
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE finsight_test LOGIN PASSWORD 'test-only' NOSUPERUSER NOCREATEDB NOCREATEROLE;"
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE finsight_test OWNER finsight_test;"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:api
      - run: npm run test:discovery
      - run: npm run test:db
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: test-results/
