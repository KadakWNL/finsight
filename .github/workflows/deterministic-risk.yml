name: Deterministic risk checks
on:
  pull_request:
    paths: ['migrations/**', 'scripts/**', 'src/server/**', 'tests/risk-verification.mjs', '.github/workflows/deterministic-risk.yml']
  push:
    branches: [main]
    paths: ['migrations/**', 'scripts/**', 'src/server/**', 'tests/risk-verification.mjs', '.github/workflows/deterministic-risk.yml']
permissions:
  contents: read
jobs:
  deterministic-risk:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-disposable-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://finsight_risk:test-only@localhost:5432/finsight_risk_test
      MIGRATOR_DATABASE_URL: postgresql://finsight_risk:test-only@localhost:5432/finsight_risk_test
      ALLOW_TEST_DATABASE: 'true'
      ALLOW_SYNTHETIC_SEED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Provision isolated migrator and database
        env:
          PGPASSWORD: ci-disposable-only
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE finsight_risk LOGIN PASSWORD 'test-only' NOSUPERUSER NOCREATEDB NOCREATEROLE;"
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE finsight_risk_test OWNER finsight_risk;"
      - run: npm run db:migrate:test
      - run: npm run db:migrate:test
      - run: node --conditions=react-server tests/risk-verification.mjs
      - run: npm run db:seed
      - run: npm run db:seed
