name: Financial guard checks
on:
  pull_request:
    paths: ['migrations/**', 'tests/sql/**', 'tests/financial-verification.mjs', '.github/workflows/financial-guards.yml']
  push:
    branches: [main]
    paths: ['migrations/**', 'tests/sql/**', 'tests/financial-verification.mjs', '.github/workflows/financial-guards.yml']
permissions:
  contents: read
jobs:
  financial-guards:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-disposable-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Provision isolated roles and database
        env:
          PGPASSWORD: ci-disposable-only
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE finsight_finance LOGIN PASSWORD 'test-only' NOSUPERUSER NOCREATEDB NOCREATEROLE;"
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE finsight_finance_runtime NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE; GRANT finsight_finance_runtime TO finsight_finance;"
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE finsight_finance_test OWNER finsight_finance;"
      - name: Verify guards, contention and query plans
        env:
          TEST_DATABASE_URL: postgresql://finsight_finance:test-only@localhost:5432/finsight_finance_test
          ALLOW_TEST_DATABASE: 'true'
          PGHOST: localhost
          PGUSER: finsight_finance
          PGPASSWORD: test-only
          PGDATABASE: finsight_finance_test
        run: |
          npm run db:migrate:test
          npm run db:migrate:test
          psql -X -v ON_ERROR_STOP=1 -v runtime_role=finsight_finance_runtime -f tests/sql/financial_guards.sql
          node --env-file-if-exists=.env.local tests/financial-verification.mjs
