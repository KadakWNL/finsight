name: Operational schema checks
on:
  pull_request:
    paths: ['migrations/**', 'tests/sql/**', 'scripts/*migration*', '.github/workflows/operational-schema.yml']
  push:
    branches: [main]
    paths: ['migrations/**', 'tests/sql/**', 'scripts/*migration*', '.github/workflows/operational-schema.yml']
permissions:
  contents: read
jobs:
  operational-schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-disposable-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Provision isolated migration owner
        env:
          PGPASSWORD: ci-disposable-only
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE finsight_ops LOGIN PASSWORD 'test-only' NOSUPERUSER NOCREATEDB NOCREATEROLE;"
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE finsight_ops_test OWNER finsight_ops;"
      - name: Apply migrations, verify repeatability and constraints
        env:
          TEST_DATABASE_URL: postgresql://finsight_ops:test-only@localhost:5432/finsight_ops_test
          ALLOW_TEST_DATABASE: 'true'
          PGHOST: localhost
          PGUSER: finsight_ops
          PGPASSWORD: test-only
          PGDATABASE: finsight_ops_test
        run: |
          npm run db:migrate:test
          npm run db:migrate:test
          psql -v ON_ERROR_STOP=1 -f tests/sql/operational_schema.sql
