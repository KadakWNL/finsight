openapi: 3.1.0
info:
  title: FinSight transaction read API
  version: 1.0.0
  description: Authenticated masked financial reads. Cookie names depend on HTTP development versus HTTPS production.
security:
  - localCookie: []
  - secureCookie: []
  - encryptedBearer: []
paths:
  /api/v1/transactions:
    get:
      operationId: listTransactions
      summary: Filter and page masked transaction facts
      parameters:
        - {name: q, in: query, schema: {type: string, minLength: 1, maxLength: 500}, description: Description full text or exact transaction UUID.}
        - {name: transaction_id, in: query, schema: {type: string, format: uuid}}
        - {name: account_id, in: query, schema: {type: string, format: uuid}}
        - {name: merchant_id, in: query, schema: {type: string, format: uuid}}
        - {name: device_id, in: query, schema: {type: string, format: uuid}}
        - {name: from, in: query, schema: {type: string, format: date-time}, description: Inclusive timestamp with timezone and at most six fractional digits.}
        - {name: to, in: query, schema: {type: string, format: date-time}, description: Exclusive timestamp after from.}
        - {name: status, in: query, schema: {type: string, enum: [posted, pending, reversed, blocked]}}
        - {name: risk, in: query, schema: {$ref: '#/components/schemas/RiskBand'}}
        - {name: currency, in: query, schema: {type: string, enum: [INR, USD]}, description: Original currency; excluded in base-amount mode.}
        - {name: amount_mode, in: query, schema: {type: string, enum: [original, base], default: original}}
        - {name: amount_min, in: query, schema: {$ref: '#/components/schemas/AmountBound'}, description: Inclusive bound; original mode requires currency.}
        - {name: amount_max, in: query, schema: {$ref: '#/components/schemas/AmountBound'}, description: Inclusive bound not below minimum.}
        - {name: sort, in: query, schema: {type: string, enum: [occurred_at, amount, risk_score, status], default: occurred_at}, description: Amount sorting requires original currency or base mode.}
        - {name: order, in: query, schema: {type: string, enum: [asc, desc], default: desc}}
        - {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
        - {name: cursor, in: query, schema: {type: string, maxLength: 4096}, description: Signed opaque continuation bound to actor/role and the complete normalized query.}
      responses:
        '200':
          description: Live page; exact totals are not returned.
          headers: {Cache-Control: {schema: {type: string}, example: 'private, no-store'}}
          content:
            application/json:
              schema:
                type: object
                required: [data, page_size, next_cursor, request_id]
                properties:
                  data: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/Transaction'}}
                  page_size: {type: integer, minimum: 1, maximum: 100}
                  next_cursor: {type: [string, 'null']}
                  request_id: {type: string, format: uuid}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/transactions/{id}:
    get:
      operationId: transactionRiskDetail
      summary: Read masked context and recorded risk in one SQL snapshot
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Transaction facts and recorded explanation. Query parameters are not accepted.
          headers: {Cache-Control: {schema: {type: string}, example: 'private, no-store'}}
          content:
            application/json:
              schema:
                type: object
                required: [data, request_id]
                properties:
                  request_id: {type: string, format: uuid}
                  data:
                    allOf:
                      - {$ref: '#/components/schemas/Transaction'}
                      - type: object
                        required: [signals, coverage, signal_summary, configuration_label]
                        properties:
                          signals: {type: array, items: {$ref: '#/components/schemas/Signal'}}
                          coverage: {type: string}
                          signal_summary: {type: string}
                          configuration_label: {type: string}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
components:
  securitySchemes:
    localCookie: {type: apiKey, in: cookie, name: next-auth.session-token, description: Development HTTP only.}
    secureCookie: {type: apiKey, in: cookie, name: __Host-next-auth.session-token, description: HTTPS production HttpOnly cookie.}
    encryptedBearer: {type: http, scheme: bearer, bearerFormat: Auth.js encrypted JWT, description: A raw session UUID is never accepted.}
  schemas:
    RiskBand: {type: string, enum: [low, medium, high, critical]}
    Decimal: {type: string, pattern: '^\d+(\.\d+)?$'}
    AmountBound: {type: string, pattern: '^(0|[1-9]\d{0,17})(\.\d{1,2})?$'}
    ActiveCase:
      oneOf:
        - type: object
          additionalProperties: false
          required: [exists, access]
          properties: {exists: {const: false}, access: {const: none}}
        - type: object
          additionalProperties: false
          required: [exists, access]
          properties: {exists: {const: true}, access: {const: restricted}}
        - type: object
          additionalProperties: false
          required: [exists, access, case_id, case_ref, status]
          properties:
            exists: {const: true}
            access: {const: permitted}
            case_id: {type: string, format: uuid}
            case_ref: {type: string}
            status: {type: string, enum: [open, in_review, escalated]}
    Transaction:
      type: object
      required: [transaction_id, account_id, merchant_id, device_id, amount, currency_code, exchange_rate, amount_base, direction, status, txn_type, occurred_at, description, merchant_name, current_merchant_tier, risk_score, signal_count, risk_band, account, customer, merchant, device, payment_method, transaction_location, active_case]
      properties:
        transaction_id: {type: string, format: uuid}
        account_id: {type: string, format: uuid}
        merchant_id: {type: string, format: uuid}
        device_id: {type: string, format: uuid}
        amount: {$ref: '#/components/schemas/Decimal'}
        currency_code: {type: string, enum: [INR, USD]}
        exchange_rate: {$ref: '#/components/schemas/Decimal'}
        amount_base: {$ref: '#/components/schemas/Decimal'}
        direction: {type: string, enum: [debit, credit]}
        status: {type: string, enum: [posted, pending, reversed, blocked]}
        txn_type: {const: card_payment}
        occurred_at: {type: string, format: date-time, description: UTC with six fractional digits.}
        description: {type: string}
        merchant_name: {type: string}
        current_merchant_tier: {type: string, enum: [low, medium, high]}
        risk_score: {$ref: '#/components/schemas/Decimal'}
        signal_count: {type: integer, minimum: 0}
        risk_band: {$ref: '#/components/schemas/RiskBand'}
        active_case: {$ref: '#/components/schemas/ActiveCase'}
        account:
          type: object
          required: [account_id, number_masked, account_type, currency_code, status]
          properties:
            account_id: {type: string, format: uuid}
            number_masked: {type: string}
            account_type: {type: string}
            currency_code: {type: string, enum: [INR, USD]}
            status: {type: string}
        customer:
          type: object
          required: [customer_id, display_label, country_code, status]
          properties:
            customer_id: {type: string, format: uuid}
            display_label: {type: string}
            country_code: {type: string}
            status: {type: string}
        merchant:
          type: object
          required: [merchant_id, name, category_code, country_code, city, current_risk_tier]
          properties:
            merchant_id: {type: string, format: uuid}
            name: {type: string}
            category_code: {type: string}
            country_code: {type: string}
            city: {type: [string, 'null']}
            current_risk_tier: {type: string, enum: [low, medium, high]}
        device:
          type: object
          required: [device_id, os_family, first_seen_country]
          properties:
            device_id: {type: string, format: uuid}
            os_family: {type: string}
            first_seen_country: {type: [string, 'null']}
        payment_method:
          type: [object, 'null']
          required: [method_id, method_type, last4]
          properties:
            method_id: {type: string, format: uuid}
            method_type: {type: string}
            last4: {type: [string, 'null']}
        transaction_location:
          type: object
          required: [country_code, city]
          properties: {country_code: {type: string}, city: {type: [string, 'null']}}
    Signal:
      type: object
      required: [signal_id, observed_value, score_contribution, evidence, triggered_at, rule_code, rule_name, dimension, current_rule_weight, current_rule_threshold, current_rule_active, current_rule_version]
      properties:
        signal_id: {type: string, format: uuid}
        observed_value: {$ref: '#/components/schemas/Decimal'}
        score_contribution: {$ref: '#/components/schemas/Decimal'}
        evidence: {type: string}
        triggered_at: {type: string, format: date-time}
        rule_code: {type: string}
        rule_name: {type: string}
        dimension: {type: string}
        current_rule_weight: {$ref: '#/components/schemas/Decimal'}
        current_rule_threshold: {$ref: '#/components/schemas/Decimal'}
        current_rule_active: {type: boolean}
        current_rule_version: {type: integer, minimum: 1}
    Error:
      type: object
      required: [error, request_id]
      properties:
        request_id: {type: string, format: uuid}
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string, enum: [invalid_request, unauthenticated, forbidden, not_found, dependency_unavailable]}
            message: {type: string}
            fields: {type: object, additionalProperties: {type: string}}
  responses:
    InvalidRequest:
      description: Malformed, repeated, unknown or ambiguous parameter, ID or signed cursor.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Unauthenticated:
      description: Missing or invalid encrypted credential, expired/revoked session, inactive user or nonhuman role.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Forbidden:
      description: Authenticated role outside the human read policy.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    NotFound:
      description: No transaction for a valid UUID.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Unavailable:
      description: Authentication or database dependency unavailable; no SQL/connection details exposed.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
